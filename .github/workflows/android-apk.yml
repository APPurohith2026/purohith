name: Android test APK
on:
  push:
    branches: [feature/android-apk]
    paths: ['mobile/**', 'frontend/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: 'mobile/android/**/*.gradle'
      - name: Install website dependencies
        run: npm ci --prefix frontend
      - name: Install Android app dependencies
        run: npm ci --prefix mobile
      - name: Bundle website and sync native plugins
        working-directory: mobile
        run: npm run sync
      - name: Build and lint test APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --no-daemon
      - name: Upload installable test APK
        uses: actions/upload-artifact@v6
        with:
          name: AP-Purohit-Samakya-test-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
