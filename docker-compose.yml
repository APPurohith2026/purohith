services:
  mysql:
    image: mysql:8.4
    container_name: purohit-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-purohit_local}
      MYSQL_USER: ${MYSQL_USER:-purohit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-purohit123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "3306:3306"
    volumes:
      - purohit_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  purohit_mysql_data:
