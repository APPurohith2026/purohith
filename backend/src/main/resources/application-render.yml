# Render supplies PostgreSQL connection fields through render.yaml.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    # Bootstrap new tables without dropping hosted data. Use versioned migrations
    # before introducing complex schema changes to a populated database.
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
server:
  forward-headers-strategy: framework
app:
  jwt:
    secret: ${JWT_SECRET}
  admin:
    email: ${APP_ADMIN_EMAIL}
    password: ${APP_ADMIN_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    private-dir: ${PRIVATE_UPLOAD_DIR:/var/data/private}
