spring:
  application:
    name: purohit-portal-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-before-production-123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@purohit.local}
    password: ${APP_ADMIN_PASSWORD:Admin@12345}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    private-dir: ${PRIVATE_UPLOAD_DIR:./uploads/private}
